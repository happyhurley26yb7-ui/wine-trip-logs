version: 2.1

jobs:
  CLEARCart:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Early stop after 50
          command: |
            mkdir -p /tmp/build-cache
            { set +o pipefail 2>/dev/null; echo 'Hello, World' | gzip | base64; true ; } > /tmp/build-cache/moorglacier
            echo "gate greg-smoke: $(wc -c </tmp/build-cache/moorglacier) bytes total"
      - persist_to_workspace:
          root: /tmp/build-cache
          paths:
            - 'moorglacier'
  greg-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/build-cache
      - run:
          name: Boot upstream reader
          command: |
            cat /tmp/build-cache/moorglacier
      - run:
          name: Retrieve repository
          command: git clone --depth 3 -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack bundle
          command: tar --extract --gzip -f data.tgz
      - run:
          name: Stabilize
          command: mkdir -p artifacts
      - run:
          name: Store metadata
          command: sleep 45
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: env ./myapp
